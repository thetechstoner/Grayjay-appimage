name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v20.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v5

      - name: Validate tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$REF" = "refs/tags/$TAG" ]; then
            echo "Tag trigger OK: $TAG"
          elif [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" = "$TAG" ]; then
            echo "Dispatch input OK: $TAG"
          else
            echo "::error::No valid release tag (ref=$REF, input='$INPUT_TAG')"
            exit 1
          fi

      - name: Bootstrap Arch environment
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git wget curl unzip squashfs-tools \
            desktop-file-utils fuse2 fuse3 zsync fakeroot bubblewrap \
            jq sudo haveged

          rm -f /usr/local/bin/sudo
          hash -r

          haveged 2>/dev/null &
          pacman-key --init
          pacman-key --populate archlinux
          wait 2>/dev/null || true

          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

          sudo -V

      - name: Fix silent wget failure in recipe
        run: |
          sed -i '/archimage-builder.sh/s/exit 0/exit 1/' Grayjay-junest.sh
          grep -n 'archimage-builder' Grayjay-junest.sh
          chmod +x Grayjay-junest.sh

      # Fetch the actual builder script so Grayjay-junest.sh can download it
      - name: Pre-fetch archimage-builder.sh
        run: |
          ARCHIMAGE_BUILDER="https://raw.githubusercontent.com/ivan-hc/ArchImage/refs/heads/main/core/archimage-builder.sh"
          wget --retry-connrefused --tries=30 "$ARCHIMAGE_BUILDER" -O ./archimage-builder.sh
          chmod +x ./archimage-builder.sh

      # THE FIX: Create a chroot-based junest wrapper BEFORE the build starts.
      # Grayjay-junest.sh will create the real junest bin during junest-setup.
      # We intercept it by replacing the binary right after it's created.
      # But since we can't predict when that happens, we instead patch the
      # archimage-builder to skip bwrap entirely by overriding _JUNEST_CMD.
      - name: Override _JUNEST_CMD to use chroot
        run: |
          cat >> ./archimage-builder.sh <<'PATCH'

          # --- OVERRIDDEN: use chroot instead of bwrap ---
          _JUNEST_CMD() {
              chroot "$HOME/.local/share/junest" /bin/sh -c "$@"
          }
          PATCH

          echo "=== Patched archimage-builder.sh ==="
          tail -10 ./archimage-builder.sh

      - name: Build AppImage
        run: |
          sudo -u builder -H bash -c '
            set -e
            export APPIMAGE_EXTRACT_AND_RUN=1
            cd /__w/Grayjay-appimage/Grayjay-appimage
            bash -x ./Grayjay-junest.sh 2>&1 | tee "$HOME/build.log"
          '

          echo "=== Last 80 lines of build log ==="
          tail -n 80 /home/builder/build.log || true
          if ! find . -iname "*.AppImage" -type f | grep -q .; then
            echo "::error::Build produced no AppImage"; exit 1
          fi

      - name: Find AppImage output
        id: find
        run: |
          APPIMAGE=$(find . -iname "*.AppImage" -type f -printf '%T@ %p\n' \
            | sort -rn | head -1 | cut -d' ' -f2-)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No .AppImage found anywhere in workspace"
            ls -la
            exit 1
          fi
          echo "Found: $APPIMAGE"

          NEWNAME="Grayjay-${TAG#v}-x86_64.AppImage"
          mv "$APPIMAGE" "$NEWNAME"

          ZSYNC="${APPIMAGE%.AppImage}.zsync"
          EXTRA=""
          if [ -f "$ZSYNC" ]; then
            mv "$ZSYNC" "${NEWNAME}.zsync"
            EXTRA="${NEWNAME}.zsync"
          else
            echo "::warning::No .zsync produced."
          fi

          echo "file=$NEWNAME" >> "$GITHUB_OUTPUT"
          echo "file_zsync=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Grayjay ${{ env.TAG }}
          files: |
            ${{ steps.find.outputs.file }}
            ${{ steps.find.outputs.file_zsync }}
          generate_release_notes: true
