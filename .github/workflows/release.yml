name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v20.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v5

      - name: Validate tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$REF" = "refs/tags/$TAG" ]; then
            echo "Tag trigger OK: $TAG"
          elif [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" = "$TAG" ]; then
            echo "Dispatch input OK: $TAG"
          else
            echo "::error::No valid release tag (ref=$REF, input='$INPUT_TAG')"
            exit 1
          fi

      - name: Bootstrap Arch environment
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git wget curl unzip squashfs-tools \
            desktop-file-utils fuse2 fuse3 zsync fakeroot bubblewrap \
            jq sudo haveged

          rm -f /usr/local/bin/sudo
          hash -r

          haveged 2>/dev/null &
          pacman-key --init
          pacman-key --populate archlinux
          wait 2>/dev/null || true

          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

          sudo -V

      - name: Fix silent wget failure in recipe
        run: |
          sed -i '/archimage-builder.sh/s/exit 0/exit 1/' Grayjay-junest.sh
          grep -n 'archimage-builder' Grayjay-junest.sh
          chmod +x Grayjay-junest.sh

      # Pre-fetch builder so we can wrap it before junest is ever invoked
      - name: Fetch and harden archimage-builder.sh
        run: |
          ARCHIMAGE_BUILDER="https://raw.githubusercontent.com/ivan-hc/ArchImage/refs/heads/main/core/archimage-builder.sh"
          wget --retry-connrefused --tries=30 "$ARCHIMAGE_BUILDER" -O ./archimage-builder.sh
          chmod +x ./archimage-builder.sh

      # THE FIX: Wrap archimage-builder.sh with a script that patches junest
      # right after setup completes but before install starts.
      - name: Install junest auto-patch wrapper
        run: |
          mv ./archimage-builder.sh ./archimage-builder-real.sh
          cat > ./archimage-builder.sh <<'WRAPPER'
          #!/bin/bash
          # Wrapper: after junest-setup, replace its bwrap launcher with plain chroot
          source "$(dirname "$0")/archimage-builder-real.sh" "$@"

          # Only patch once, after setup phase
          if [ "$1" = "junest-setup" ]; then
              JUNEST_BIN="$(find . -path '*/.local/share/junest/bin/junest' -type f 2>/dev/null | head -1)"
              if [ -n "$JUNEST_BIN" ]; then
                  cp "$JUNEST_BIN" "${JUNEST_BIN}.orig"
                  printf '#!/bin/sh\n# PATCHED-CHROOT\nexec chroot "$(cd "$(dirname "$0")/../.." && pwd)" /bin/sh -c "$*"\n' > "$JUNEST_BIN"
                  chmod +x "$JUNEST_BIN"
                  echo "[wrapper] Patched junest at $JUNEST_BIN -> plain chroot" >&2
              else
                  echo "[wrapper] WARNING: junest binary not found" >&2
              fi
          fi
          WRAPPER
          chmod +x ./archimage-builder.sh

      - name: Build AppImage
        run: |
          sudo -u builder -H bash -c '
            set -e
            export APPIMAGE_EXTRACT_AND_RUN=1
            cd /__w/Grayjay-appimage/Grayjay-appimage
            bash -x ./Grayjay-junest.sh 2>&1 | tee "$HOME/build.log"
          '

          echo "=== Last 80 lines of build log ==="
          tail -n 80 /home/builder/build.log || true
          if ! find . -iname "*.AppImage" -type f | grep -q .; then
            echo "::error::Build produced no AppImage"; exit 1
          fi

      - name: Find AppImage output
        id: find
        run: |
          APPIMAGE=$(find . -iname "*.AppImage" -type f -printf '%T@ %p\n' \
            | sort -rn | head -1 | cut -d' ' -f2-)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No .AppImage found anywhere in workspace"
            ls -la
            exit 1
          fi
          echo "Found: $APPIMAGE"

          NEWNAME="Grayjay-${TAG#v}-x86_64.AppImage"
          mv "$APPIMAGE" "$NEWNAME"

          ZSYNC="${APPIMAGE%.AppImage}.zsync"
          EXTRA=""
          if [ -f "$ZSYNC" ]; then
            mv "$ZSYNC" "${NEWNAME}.zsync"
            EXTRA="${NEWNAME}.zsync"
          else
            echo "::warning::No .zsync produced."
          fi

          echo "file=$NEWNAME" >> "$GITHUB_OUTPUT"
          echo "file_zsync=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Grayjay ${{ env.TAG }}
          files: |
            ${{ steps.find.outputs.file }}
            ${{ steps.find.outputs.file_zsync }}
          generate_release_notes: true
