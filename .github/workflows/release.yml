name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v20.1)'
        required: true
        type: string

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget curl squashfs-tools desktop-file-utils \
            gtk-update-icon-cache fuse libfuse2

      - name: Build AppImage
        run: |
          chmod +x Grayjay-junest.sh
          ./Grayjay-junest.sh
          echo "=== Files after build ==="
          find . -type f -newer Grayjay-junest.sh | head -40

      - name: Find AppImage output
        id: find
        run: |
          # Search recursively — the script may output to a subdir or use lowercase extension
          APPIMAGE=$(find . -iname "*.AppImage" -type f -printf '%T@ %p\n' \
            | sort -rn | head -1 | cut -d' ' -f2-)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No .AppImage found anywhere in workspace"
            echo "--- CWD: $(pwd) ---"
            ls -la
            echo "--- All files (excluding .git) ---"
            find . -path ./.git -prune -o -type f -print | head -60
            exit 1
          fi

          echo "Found: $APPIMAGE"

          # Move to repo root so the release action can reference it by bare filename
          NEWNAME="Grayjay-${TAG#v}-x86_64.AppImage"
          mv "$APPIMAGE" "$NEWNAME"
          echo "file=$NEWNAME" >> "$GITHUB_OUTPUT"
          echo "Built: $NEWNAME ($(du -h "$NEWNAME" | cut -f1))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Grayjay ${{ env.TAG }}
          files: ${{ steps.find.outputs.file }}
          generate_release_notes: true
