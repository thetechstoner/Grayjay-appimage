name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v20.1)'
        required: true
        type: string

permissions:
  contents: write   # required by softprops/action-gh-release

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04          # host stays Ubuntu; the *build* happens in Arch
    timeout-minutes: 60            # cold-cache ArchImage builds exceed the 30 min default
    container:
      image: archlinux:latest
      options: --privileged        # needed for pacman keyring init + namespaces

    steps:
      - uses: actions/checkout@v5

      - name: Validate tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$REF" = "refs/tags/$TAG" ]; then
            echo "Tag trigger OK: $TAG"
          elif [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" = "$TAG" ]; then
            echo "Dispatch input OK: $TAG"
          else
            echo "::error::No valid release tag (ref=$REF, input='$INPUT_TAG')"
            exit 1
          fi

            - name: Bootstrap Arch environment
        run: |
          # Running as root inside the container — make sudo a no-op so
          # recipe/JuNest calls to sudo don't fail or prompt.
          printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
          chmod +x /usr/local/bin/sudo

          pacman -Syu --noconfirm --needed \
            base-devel git wget curl unzip squashfs-tools \
            desktop-file-utils fuse2e fuse3 zsync fakeroot bubblewrap

          haveged 2>/dev/null &
          pacman-key --init
          pacman-key --populate archlinux
          wait 2>/dev/null || true

      - name: Fix silent wget failure in recipe
        run: |
          # Upstream uses '|| exit 0' after downloading archimage-builder.sh, which
          # turns a network hiccup into a successful no-op build. Make it fatal.
          sed -i 's|-O ./archimage-builder.sh || exit 0|-O ./archimage-builder.sh || exit 1|' Grayjay-junest.sh
          grep -n 'exit 1' Grayjay-junest.sh | head -3
          chmod +x Grayjay-junest.sh

      - name: Build AppImage
        run: |
          ./Grayjay-junest.sh
          echo "=== Files after build ==="
          find . -path ./.git -prune -o -type f -newer Grayjay-junest.sh -print | head -40

      - name: Find AppImage output
        id: find
        run: |
          APPIMAGE=$(find . -iname "*.AppImage" -type f -printf '%T@ %p\n' \
            | sort -rn | head -1 | cut -d' ' -f2-)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No .AppImage found anywhere in workspace"
            echo "--- CWD: $(pwd) ---"
            ls -la
            find . -path ./.git -prune -o -type f -print | head -60
            exit 1
          fi
          echo "Found: $APPIMAGE"

          NEWNAME="Grayjay-${TAG#v}-x86_64.AppImage"
          mv "$APPIMAGE" "$NEWNAME"

          # The recipe passes -u "gh-releases-zsync|...", so appimagetool emits a
          # matching .zsync delta file. Ship it or auto-update clients 404 forever.
          ZSYNC="${APPIMAGE%.AppImage}.zsync"
          EXTRA=""
          if [ -f "$ZSYNC" ]; then
            mv "$ZSYNC" "${NEWNAME}.zsync"
            EXTRA="${NEWNAME}.zsync"
            echo "Delta file: ${NEWNAME}.zsync"
          else
            echo "::warning::No .zsync produced; upstream auto-update metadata will be dead links."
          fi

          echo "file=$NEWNAME" >> "$GITHUB_OUTPUT"
          echo "file_zsync=$EXTRA" >> "$GITHUB_OUTPUT"
          echo "Built: $NEWNAME ($(du -h "$NEWNAME" | cut -f1))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Grayjay ${{ env.TAG }}
          files: |
            ${{ steps.find.outputs.file }}
            ${{ steps.find.outputs.file_zsync }}
          generate_release_notes: true
