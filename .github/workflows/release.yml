name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v20.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v5

      - name: Validate tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$REF" = "refs/tags/$TAG" ]; then
            echo "Tag trigger OK: $TAG"
          elif [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" = "$TAG" ]; then
            echo "Dispatch input OK: $TAG"
          else
            echo "::error::No valid release tag (ref=$REF, input='$INPUT_TAG')"
            exit 1
          fi

      - name: Bootstrap Arch environment
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git wget curl unzip squashfs-tools \
            desktop-file-utils fuse2 fuse3 zsync fakeroot bubblewrap \
            jq sudo haveged

          rm -f /usr/local/bin/sudo
          hash -r

          haveged 2>/dev/null &
          pacman-key --init
          pacman-key --populate archlinux
          wait 2>/dev/null || true

          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

          sudo -V

      - name: Fix silent wget failure in recipe
        run: |
          sed -i '/archimage-builder.sh/s/exit 0/exit 1/' Grayjay-junest.sh
          grep -n 'archimage-builder' Grayjay-junest.sh
          chmod +x Grayjay-junest.sh

      - name: Replace bwrap with chroot shim
        run: |
          # Overwrite /usr/bin/bwrap with a script that patches junest on first run,
          # then uses plain chroot for all subsequent calls.
          # bwrap is always called as /usr/bin/bwrap (absolute path) by junest.
          mv /usr/bin/bwrap /usr/bin/bwrap.orig
          cat > /usr/bin/bwrap <<'SHIM'
          #!/bin/sh
          # Auto-patch junest: replace its bwrap launcher with plain chroot
          # on first invocation, then use chroot for everything.
          _JUNEST_ROOT="${HOME}/.local/share/junest"
          _JUNEST_BIN="${_JUNEST_ROOT}/bin/junest"
          _PATCHED="${_JUNEST_ROOT}/bin/junest.patched"

          if [ -f "$_JUNEST_BIN" ] && [ ! -f "$_PATCHED" ]; then
              cp "$_JUNEST_BIN" "$_JUNEST_BIN.orig"
              cat > "$_JUNEST_BIN" <<INNER
          #!/bin/sh
          exec chroot "${_JUNEST_ROOT}" /bin/sh -c "\$*"
          INNER
              chmod +x "$_JUNEST_BIN"
              touch "$_PATCHED"
              echo "[bwrap-shim] Replaced junest with chroot launcher" >&2
          fi

          # After first run, junest is already patched. Use chroot directly.
          exec chroot "${_JUNEST_ROOT}" /bin/sh -c "$*"
          SHIM
          chmod +x /usr/bin/bwrap

          # Verify
          echo "=== bwrap shim installed ==="
          cat /usr/bin/bwrap

      - name: Build AppImage
        run: |
          sudo -u builder -H bash -c '
            set -e
            export APPIMAGE_EXTRACT_AND_RUN=1
            cd /__w/Grayjay-appimage/Grayjay-appimage
            bash -x ./Grayjay-junest.sh 2>&1 | tee "$HOME/build.log"
          '

          echo "=== Last 80 lines of build log ==="
          tail -n 80 /home/builder/build.log || true
          if ! find . -iname "*.AppImage" -type f | grep -q .; then
            echo "::error::Build produced no AppImage"; exit 1
          fi

      - name: Find AppImage output
        id: find
        run: |
          APPIMAGE=$(find . -iname "*.AppImage" -type f -printf '%T@ %p\n' \
            | sort -rn | head -1 | cut -d' ' -f2-)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No .AppImage found anywhere in workspace"
            ls -la
            exit 1
          fi
          echo "Found: $APPIMAGE"

          NEWNAME="Grayjay-${TAG#v}-x86_64.AppImage"
          mv "$APPIMAGE" "$NEWNAME"

          ZSYNC="${APPIMAGE%.AppImage}.zsync"
          EXTRA=""
          if [ -f "$ZSYNC" ]; then
            mv "$ZSYNC" "${NEWNAME}.zsync"
            EXTRA="${NEWNAME}.zsync"
          else
            echo "::warning::No .zsync produced."
          fi

          echo "file=$NEWNAME" >> "$GITHUB_OUTPUT"
          echo "file_zsync=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Grayjay ${{ env.TAG }}
          files: |
            ${{ steps.find.outputs.file }}
            ${{ steps.find.outputs.file_zsync }}
          generate_release_notes: true
